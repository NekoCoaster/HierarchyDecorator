name: Publish listing page
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'Website/**'
      - 'Tools/build_site.py'
      - '.github/workflows/publish-listing.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read existing published listing
        run: curl --fail --retry 3 --silent --show-error https://nekocoaster.github.io/HierarchyDecorator/index.json -o listing.json
      - name: Build website without rebuilding release ZIPs
        run: python Tools/build_site.py --listing listing.json --output site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
